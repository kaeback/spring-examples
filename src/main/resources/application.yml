spring:
  application:
    name: spring-basic

  # ── H2 인메모리 DB (web04 JPA 기초 · web05 Spring Data JPA 실습용) ──
  # 별도 DB 설치 없이 메모리에서 동작한다. 애플리케이션을 끄면 데이터는 사라진다.
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 웹 콘솔: 실행 후 http://localhost:8080/h2-console 접속
  #   JDBC URL 칸에 위 url(jdbc:h2:mem:testdb)을 그대로 입력하면 테이블을 눈으로 볼 수 있다.
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # create: 시작 시 테이블을 새로 만든다(기존 것은 drop). 실습/학습에 적합.
      ddl-auto: create
    # 실행되는 SQL을 콘솔에 출력 → JPA가 만드는 SQL을 눈으로 확인하는 습관이 중요
    show-sql: true
    properties:
      hibernate:
        format_sql: true              # SQL을 보기 좋게 줄바꿈
        # N+1 해결책 ③ 배치 사이즈: 단건 조회 N번을 IN 쿼리로 묶어 1+1번으로 줄임.
        # web05 의 N+1 '문제'를 콘솔에서 직접 보려고 기본은 꺼 두었다.
        # 아래 줄의 주석을 풀면 N번 조회가 IN 쿼리 하나로 줄어드는 것을 확인할 수 있다.
        # default_batch_fetch_size: 100

  # web07 파일 업로드 옵션
  servlet:
    multipart:
      max-file-size: 1MB              # 파일 하나의 최대 크기
      max-request-size: 10MB          # 요청 하나의 전체 합

# 바인딩된 파라미터 값(?에 들어가는 실제 값)까지 로그로 보기 (Hibernate 6 이상)
logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

# web07 업로드 파일 저장 경로 (OS 임시 폴더 하위). 마지막 / 포함
file:
  dir: ${java.io.tmpdir}/spring-basic-upload/
