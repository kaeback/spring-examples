<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [교안 2.4] 스프링 부트 오류 페이지 (4xx 계열 공통).
  BasicErrorController 가 상태 코드에 맞춰 error/404.html → ... → error/4xx.html 순서로 찾는다.
  이 프로젝트에는 404.html 이 없으므로 400·404 등 4xx 오류는 모두 이 화면이 보인다.
  (브라우저 요청에만 화면으로 응답하고, HTML을 원하지 않는 요청(curl 기본값 등)에는 JSON으로 응답한다)
-->
<head>
    <meta charset="UTF-8">
    <title>요청 오류</title>
</head>
<body>
<h1>요청을 처리할 수 없습니다</h1>
<!-- BasicErrorController 가 status, error, path, timestamp 등을 모델에 담아 준다 -->
<p>
    <span th:text="${status}">400</span> · <span th:text="${error}">Bad Request</span> ·
    <span th:text="${path}">/path</span>
</p>
<a th:href="@{/}">처음으로</a>
</body>
</html>
