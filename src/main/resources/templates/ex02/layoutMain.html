<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  14. 템플릿 레이아웃 — 공통 head 를 base.html 의 조각으로 재사용한다.

  ✅ 권장(Thymeleaf 3.1): 바깥 조각 호출을 ~{...} 로 감싼다.
       th:replace="~{ex02/base :: common_header(~{::title}, ~{::link})}"
  ❌ 폐기: th:replace="ex02/base :: common_header(...)"  (~{} 누락 → 경고)

  안쪽 ~{::title}, ~{::link} 는 '이 페이지의 <title>, <link> 태그'를 인자로 넘기는 조각 표현식이다.
-->
<head th:replace="~{ex02/base :: common_header(~{::title}, ~{::link})}">
    <title>메인 페이지 타이틀</title>
    <link rel="stylesheet" th:href="@{/css/page.css}">
</head>
<body>
<h2>레이아웃 적용 페이지</h2>
<p>이 페이지의 &lt;head&gt;는 base.html 의 common_header 조각으로 대체되었고,
   위에서 넘긴 title 과 link 가 그 안에 끼워졌습니다. (페이지 소스 보기로 확인해 보세요.)</p>
<a th:href="@{/ex02}">목록으로</a>
</body>
</html>
