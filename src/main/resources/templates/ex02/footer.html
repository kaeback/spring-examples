<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- th:fragment 으로 재사용할 조각을 정의한다. 다른 템플릿에서 'ex02/footer :: copy' 로 불러온다. -->
<footer th:fragment="copy">푸터 자리입니다.</footer>

<!-- 파라미터를 받는 조각 -->
<footer th:fragment="copyParam (param1, param2)">
    <p>파라미터1 = <span th:text="${param1}"></span></p>
    <p>파라미터2 = <span th:text="${param2}"></span></p>
</footer>
</body>
</html>
