<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- [교안 2.5] 리터럴 · 연산 · 속성 값 설정 -->
<head>
    <meta charset="UTF-8">
    <title>리터럴과 연산</title>
    <style>.large { font-size: 18px; }</style>
</head>
<body>
<h2>2.5 리터럴</h2>
<ul>
    <!-- 문자 리터럴은 작은따옴표로 감싼다. 공백이 있으면 반드시 감싸야 한다 -->
    <li>'hello' + ' world!' = <span th:text="'hello' + ' world!'"></span></li>
    <!-- 리터럴 대체 |...| : 문자열 안에 ${...} 를 바로 섞어 쓴다 -->
    <li>|hello ${data}| = <span th:text="|hello ${data}|"></span></li>
</ul>

<h2>2.5 연산</h2>
<ul>
    <li>10 + 2 = <span th:text="10 + 2"></span></li>
    <li>1 gt 10 = <span th:text="1 gt 10"></span></li>
    <!-- 조건식 (삼항) -->
    <li>(10 % 2 == 0)? '짝수':'홀수' = <span th:text="(10 % 2 == 0)? '짝수':'홀수'"></span></li>
    <!-- Elvis 연산자: 값이 있으면 그 값, null 이면 ?: 뒤 -->
    <li>${data}?: ... = <span th:text="${data}?: '데이터가 없습니다.'"></span></li>
    <li>${nullData}?: ... = <span th:text="${nullData}?: '데이터가 없습니다.'"></span></li>
    <!-- No-Operation(_): 타임리프가 아무것도 하지 않은 것처럼 → 원래 HTML 글자가 그대로 남는다 -->
    <li>${nullData}?: _ = <span th:text="${nullData}?: _">데이터가 없습니다.(원래 글자)</span></li>
</ul>

<h2>2.5 속성 값 설정</h2>
<!-- th:속성명 : 기존 속성을 대체 / th:classappend : class 에 추가 / th:checked : false 면 속성 자체를 제거 -->
<input type="text" name="mock" th:name="userA" value="원래 name 은 mock"/>
<input type="text" class="text" th:classappend="large" value="class=text large"/>
<label><input type="checkbox" th:checked="true"/> checked=true</label>
<label><input type="checkbox" th:checked="false"/> checked=false</label>

<p><a th:href="@{/ex02}">목록으로</a></p>
</body>
</html>
