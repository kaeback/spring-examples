<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>텍스트 출력</title>
</head>
<body>
<h2>2. 텍스트 출력</h2>
<ul>
    <!-- th:text : 태그 속성으로 출력. HTML 특수문자를 이스케이프한다(<b> → &lt;b&gt;) -->
    <li>th:text = <span th:text="${data}"></span></li>
    <!-- [[...]] : 콘텐츠 영역에 직접 출력 (이스케이프됨) -->
    <li>[[...]] 직접 출력 = [[${data}]]</li>
    <!-- th:utext : unescape. 태그를 그대로 렌더링한다. (사용자 입력엔 쓰지 말 것 - XSS 위험) -->
    <li>th:utext = <span th:utext="${data}"></span></li>
</ul>

<h2>4. 스프링 빈 호출</h2>
<ul>
    <!-- ${@빈이름.메서드(...)} 로 스프링 빈의 메서드를 직접 호출 -->
    <li>spring bean = <span th:text="${@helloBean.hello('Spring!')}"></span></li>
</ul>

<a th:href="@{/ex02}">목록으로</a>
</body>
</html>
