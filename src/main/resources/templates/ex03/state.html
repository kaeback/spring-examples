<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- [교안 쿠키·세션 2.1·2.2] 쿠키·세션 상태 화면 — CookieSessionController.state() 가 값을 채운다 -->
<head>
    <meta charset="UTF-8">
    <title>쿠키 · 세션 상태</title>
    <style>
        body { font-family: sans-serif; max-width: 560px; margin: 24px auto; line-height: 1.7; }
        .box { border: 1px solid #ccc; border-radius: 6px; padding: 10px 14px; margin: 10px 0; }
        b { color: #2e7d32; }
        a { color: #2e7d32; }
    </style>
</head>
<body>
<h2>쿠키 · 세션 상태</h2>

<div class="box">
    <h3>쿠키 (클라이언트 저장)</h3>
    <!-- memberId 가 있으면 값을, 없으면 '없음' 출력 (Elvis 연산자) -->
    <p>memberId = <b th:text="${memberId} ?: '없음'">없음</b></p>
    <a th:href="@{/ex03/cookie/set(memberId=1)}">쿠키 저장(memberId=1)</a> ·
    <a th:href="@{/ex03/cookie/clear}">쿠키 삭제</a>
</div>

<div class="box">
    <h3>세션 (서버 저장)</h3>
    <p th:if="${loginMember == null}">상태: <b>비로그인</b></p>
    <p th:if="${loginMember != null}">상태: <b th:text="${loginMember} + '님 로그인'">홍길동님 로그인</b></p>
    <a th:href="@{/ex03/session/login(name='홍길동')}">세션 로그인(홍길동)</a> ·
    <a th:href="@{/ex03/session/logout}">로그아웃</a> ·
    <a th:href="@{/ex03/session/info}">세션 정보 보기</a>
</div>

<p style="color:gray; font-size:0.9em;">
    링크를 눌러 상태를 바꾸면 서버가 처리 후 이 화면으로 redirect(PRG)합니다.
    개발자도구(F12) → Application → Cookies 에서 실제 쿠키(memberId, JSESSIONID)도 확인해 보세요.
</p>
<a th:href="@{/}">홈으로</a>
</body>
</html>
