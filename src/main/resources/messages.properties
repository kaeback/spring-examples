# [교안 검증 2.5] 검증 메시지 소스 (messageSource)
# 스프링 부트는 src/main/resources/messages.properties 를 기본 메시지 소스로 인식한다.
# 검증 실패 시 다음 우선순위(구체적 -> 일반)로 메시지 키를 찾는다.
#   1) 코드.객체명.필드명   예) NotBlank.memberForm.name
#   2) 코드.필드명          예) NotBlank.name
#   3) 코드.필드타입        예) NotBlank.java.lang.String
#   4) 코드                 예) NotBlank
#
# 플레이스홀더 규칙(어노테이션 message 와 다름!):
#   {0} = 필드명, {1},{2}... = 어노테이션 속성을 '이름 알파벳순'으로 채움
#   그래서 @Size/@Range 는 {1}=max, {2}=min 이 된다.

# (4) 코드 레벨 — 가장 일반적인 기본 메시지
NotBlank={0}은(는) 필수입니다.
NotNull={0}은(는) 필수입니다.
Size={0}은(는) {2}~{1}자로 입력하세요.
Range={0}은(는) {2}~{1} 사이여야 합니다.
Email={0} 형식이 올바르지 않습니다.
Pattern={0} 형식이 올바르지 않습니다.
# 타입 변환 실패(숫자 칸에 "abc" 입력 등). 없으면 영어 예외 메시지가 화면에 그대로 나온다
typeMismatch={0}에 올바른 형식의 값을 입력하세요.

# (1) 코드.객체명.필드명 — 더 구체적인 키가 우선한다(이 메시지가 위 NotBlank 를 덮어씀)
NotBlank.memberForm.name=이름을 입력해 주세요.

# 글로벌 오류(bindingResult.reject) 메시지 — MemberValidationController 의 reject 코드와 매칭
nameEqualsEmail=이름과 이메일은 같을 수 없습니다.
