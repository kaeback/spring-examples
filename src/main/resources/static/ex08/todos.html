<!DOCTYPE html>
<html lang="ko">
<!--
  [교안 2.7] fetch 로 REST API 를 부르는 화면.
  이 파일은 static 폴더의 정적 HTML 이라 서버가 내용을 채우지 않는다(빈 목록으로 도착).
  목록은 자바스크립트가 GET /ex08/api/todos 로 JSON 을 받아 그린다.
-->
<head>
    <meta charset="UTF-8">
    <title>할 일 (fetch)</title>
    <style>
        body { font-family: sans-serif; max-width: 560px; margin: 24px auto; line-height: 1.8; }
        li button { margin-left: 8px; }
        #error { color: #c62828; }
        #log { background: #f5f5f5; padding: 8px; font-size: 13px; white-space: pre-wrap; }
    </style>
</head>
<body>
<h1>할 일 — fetch로 그린 화면</h1>

<input id="title" placeholder="할 일 (30자 이내)">
<button type="button" onclick="addTodo()">추가</button>
<p id="error"></p>

<ul id="list"></ul>

<h3>요청 기록</h3>
<div id="log"></div>
<p><a href="/ex08/ssr">서버에서 그린 화면(SSR)</a> · <a href="/">처음으로</a></p>

<script>
    const API = '/ex08/api/todos';

    // 요청 한 번의 메서드·주소·상태 코드를 화면 아래에 남긴다
    function log(method, url, res) {
        const location = res.headers.get('Location');
        document.getElementById('log').textContent +=
            `${method} ${url} → ${res.status}` + (location ? ` (Location: ${location})` : '') + '\n';
    }

    // 오류 응답 {"code","message"} 의 message 를 보여 준다
    async function showError(res) {
        const error = await res.json();
        document.getElementById('error').textContent = error.message;
    }

    // 목록: GET → JSON 배열을 받아 <li> 로 그린다
    async function loadTodos() {
        const res = await fetch(API);
        log('GET', API, res);
        const todos = await res.json();
        const list = document.getElementById('list');
        list.innerHTML = '';
        for (const todo of todos) {
            const li = document.createElement('li');
            const check = document.createElement('input');
            check.type = 'checkbox';
            check.checked = todo.done;
            check.onchange = () => updateTodo(todo, check.checked);
            const text = document.createElement('span');
            text.textContent = todo.title;           // textContent: 글자 그대로 (태그로 해석 안 함)
            const del = document.createElement('button');
            del.textContent = '삭제';
            del.onclick = () => deleteTodo(todo.id);
            li.append(check, text, del);
            list.append(li);
        }
    }

    // 생성: POST + JSON 본문 → 201 이면 목록 다시 그리기
    async function addTodo() {
        const input = document.getElementById('title');
        const res = await fetch(API, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},   // 본문이 JSON 임을 알린다
            body: JSON.stringify({title: input.value})       // 객체 → JSON 문자열
        });
        log('POST', API, res);
        if (res.status === 201) {
            input.value = '';
            document.getElementById('error').textContent = '';
            loadTodos();
        } else {
            showError(res);
        }
    }

    // 수정: PUT + 전체 값 → 200
    async function updateTodo(todo, done) {
        const url = `${API}/${todo.id}`;
        const res = await fetch(url, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title: todo.title, done: done})
        });
        log('PUT', url, res);
        if (res.ok) {
            loadTodos();
        } else {
            showError(res);
        }
    }

    // 삭제: DELETE → 204 (본문 없음)
    async function deleteTodo(id) {
        const url = `${API}/${id}`;
        const res = await fetch(url, {method: 'DELETE'});
        log('DELETE', url, res);
        if (res.status === 204) {
            loadTodos();
        } else {
            showError(res);
        }
    }

    loadTodos();
</script>
</body>
</html>
